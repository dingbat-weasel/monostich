services:
  frontend:
    build: ./frontend
    depends_on:
      - db
      - backend
    env_file: .env.docker
    ports:
      - '5173:5173'
  backend:
    build: ./backend
    depends_on:
      - db
    env_file: .env.docker
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
      - /app/.venv
    command: uvicorn main:app --host 0.0.0.0 --reload

  db:
    image: postgres:18
    env_file: .env.docker
    ports:
      - '5433:5432'
    volumes:
      - db_data:/var/lib/postgresql

volumes:
  db_data:
